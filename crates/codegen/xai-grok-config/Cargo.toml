[package]
license = "Apache-2.0"
name = "xai-grok-config"
version = "0.1.0"
edition.workspace = true
description = "Grok config: grok_home, effective config (requirements over user over managed), TOML merge, service endpoints, remote settings, and vendor compat"

[dependencies]
agent-client-protocol = { workspace = true }
base64 = { workspace = true }
blake3 = { workspace = true }
chrono = { workspace = true, features = ["serde"] }
dunce = { workspace = true }
fs2 = { workspace = true }
indexmap = { workspace = true }
# Shared signed deployment-config envelope contract with the cli-chat-proxy signer.
prod-mc-cli-chat-proxy-types = { path = "../../../prod/mc/cli-chat-proxy-types" }
ring = { workspace = true }
semver = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
shellexpand = "3.1"
strum = { workspace = true }
thiserror = { workspace = true }
toml = { workspace = true }
tracing = { workspace = true }
ts-rs = { workspace = true, optional = true }
urlencoding = { workspace = true }
which = { workspace = true }
xai-dirs = { workspace = true }
xai-grok-env = { workspace = true }
xai-tty-utils = { workspace = true }
xai-grok-version = { workspace = true }

# core-foundation: read macOS MDM managed preferences (`ai.x.grok`) for the
# admin-deployed requirements layer.
[target.'cfg(target_os = "macos")'.dependencies]
core-foundation = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }

[features]
default-bazel = []
# TS bindings for the announcement types only; see xai-grok-announcements/generate.sh.
ts = ["dep:ts-rs"]

[lints]
workspace = true