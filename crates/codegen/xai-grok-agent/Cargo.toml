[package]
license = "Apache-2.0"
name = "xai-grok-agent"
version = "0.1.0"
edition.workspace = true
description = "Agent builder, definition parsing, and system prompt assembly"

[dependencies]
dunce = { workspace = true }
xai-grok-hooks = { path = "../xai-grok-hooks" }
xai-grok-sampling-types = { path = "../xai-grok-sampling-types" }
xai-grok-tools = { path = "../xai-grok-tools" }
xai-tty-utils = { workspace = true }
xai-token-estimation = { workspace = true }
minijinja = { version = "2", features = ["custom_syntax"] }
git2 = { version = "0.20", default-features = false, features = ["vendored-libgit2"] }
regex = { workspace = true }
serde = { workspace = true }
serde_yaml = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true, features = ["rt", "macros", "sync"] }
tracing = { workspace = true }
chrono = { workspace = true }
fs2 = { workspace = true }
ignore = { workspace = true }
xai-grok-config = { workspace = true }
xai-dirs = { workspace = true }
sha2 = { workspace = true }
strum = { workspace = true }
thiserror = { workspace = true }
zeroize = "1"
xai-tool-types.workspace = true

[features]
# Stock Grok's non-Pi dialect agent presets (codex/opencode/concise/hashline toolsets);
# forwards to xai-grok-tools so the dialect Tool impls register.
# NOT in this crate's default: shell->agent dependency edges do not disable
# default features, so a default here would leak the dialects into the
# grok-pi closure. The stock binaries enable it via shell's default.
stock-tool-dialects = ["xai-grok-tools/stock-tool-dialects"]
default = []
default-bazel = []

[dev-dependencies]
tempfile = { workspace = true }
serde_json = { workspace = true }
serial_test = { workspace = true }

[lints]
workspace = true
