<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<meta name="color-scheme" content="light dark" />
		<title>Pi config · grok-pi</title>
		<style>__PI_GROK_WEB_CONFIG_STYLES__</style>
	</head>
	<body>
		<div class="app-shell">
			<aside class="sidebar" aria-label="Pi config">
				<div class="brand-block">
					<div class="brand-mark" aria-hidden="true">Pi</div>
					<div class="brand-copy">
						<strong>Pi config</strong>
						<span id="meta-model">grok-pi</span>
					</div>
				</div>

				<nav class="section-nav" id="tabs" aria-label="Configuration sections">
					<button class="nav-item" type="button" data-tab="models">
						<span data-i18n="tab_models"></span><span class="nav-count" id="nav-models-count">—</span>
					</button>
					<button class="nav-item" type="button" data-tab="resources">
						<span data-i18n="tab_resources"></span><span class="nav-count" id="nav-resources-count">—</span>
					</button>
					<button class="nav-item" type="button" data-tab="host">
						<span data-i18n="tab_host"></span><span class="nav-count" id="nav-host-count">—</span>
					</button>
					<button class="nav-item" type="button" data-tab="settings">
						<span data-i18n="tab_settings"></span><span class="nav-count" id="nav-settings-count">—</span>
					</button>
				</nav>

				<div class="sidebar-meta">
					<div class="meta-row"><span data-i18n="workspace_label"></span><code id="meta-workspace">—</code></div>
					<div class="meta-row"><span data-i18n="config_label"></span><code id="meta-config">—</code></div>
				</div>

				<div class="sidebar-footer">
					<button class="btn quiet" type="button" id="btn-theme"></button>
					<button class="btn quiet" type="button" id="btn-lang"></button>
					<details class="service-menu">
						<summary data-i18n="service_actions"></summary>
						<div class="service-actions">
							<button class="btn quiet" type="button" id="btn-reload" data-i18n="reload_pi"></button>
							<button class="btn danger quiet" type="button" id="btn-stop" data-i18n="stop_server"></button>
						</div>
					</details>
				</div>
			</aside>

			<div class="workspace">
				<header class="pagebar">
					<div class="page-copy">
						<p class="eyebrow" id="page-kicker"></p>
						<h1 id="page-title"></h1>
						<p class="page-description" id="page-description"></p>
					</div>
					<div class="page-actions">
						<span class="sync-state" id="sync-state" aria-live="polite"></span>
						<button class="btn" type="button" id="btn-refresh" data-i18n="refresh"></button>
					</div>
				</header>

				<div class="status-banner hidden" id="global-status" role="status" aria-live="polite"></div>

				<main id="main-content">
					<section class="panel hidden" id="panel-models" aria-labelledby="page-title">
						<div id="models-banner" class="hidden"></div>
						<div class="models-layout">
							<aside class="surface provider-pane">
								<div class="surface-header compact">
									<label class="search-field">
										<span class="sr-only" data-i18n="search_providers"></span>
										<input type="search" id="model-search" autocomplete="off" data-i18n-placeholder="search_providers" />
									</label>
									<button class="btn primary" type="button" id="btn-add-provider" data-i18n="add_provider"></button>
								</div>
								<div class="provider-summary" id="provider-summary"></div>
								<ul class="provider-list" id="provider-list"></ul>
							</aside>

							<section class="surface provider-detail-shell">
								<header class="surface-header">
									<div class="surface-title-group">
										<p class="eyebrow" data-i18n="provider_details"></p>
										<h2 id="provider-title">Provider</h2>
									</div>
									<div class="button-row" id="provider-actions"></div>
								</header>
								<div class="surface-body" id="provider-detail"></div>
							</section>
						</div>
					</section>

					<section class="panel hidden" id="panel-resources" aria-labelledby="page-title">
						<div id="resources-banner" class="hidden"></div>
						<div class="metric-grid" id="resource-stats"></div>
						<div class="surface resource-browser">
							<div class="surface-header resource-toolbar">
								<div class="segmented" id="resource-kinds" aria-label="Resource type"></div>
								<label class="search-field resource-search">
									<span class="sr-only" data-i18n="res_filter"></span>
									<input type="search" id="resource-filter" autocomplete="off" data-i18n-placeholder="res_filter" />
								</label>
							</div>
							<div class="surface-body" id="resources-body"></div>
						</div>
					</section>

					<section class="panel hidden" id="panel-host" aria-labelledby="page-title">
						<div id="host-banner" class="hidden"></div>
						<div class="surface">
							<div class="surface-header resource-toolbar">
								<div class="surface-title-group">
									<p class="eyebrow">config.toml</p>
									<h2 data-i18n="host_registered_settings"></h2>
								</div>
								<label class="search-field resource-search">
									<span class="sr-only" data-i18n="host_filter"></span>
									<input type="search" id="host-filter" autocomplete="off" data-i18n-placeholder="host_filter" />
								</label>
							</div>
							<div class="host-section-nav" id="host-section-nav"></div>
						</div>
						<div class="host-sections" id="host-body"></div>
					</section>

					<section class="panel hidden" id="panel-settings" aria-labelledby="page-title">
						<div id="settings-banner" class="hidden"></div>
						<div class="settings-grid">
							<section class="surface">
								<header class="surface-header">
									<div class="surface-title-group">
										<p class="eyebrow" data-i18n="common_settings"></p>
										<h2 data-i18n="quick_settings"></h2>
									</div>
								</header>
								<div class="surface-body settings-toggles" id="settings-toggles"></div>
							</section>

							<section class="surface raw-settings-card">
								<details id="raw-settings-details">
									<summary class="raw-summary">
										<span>
											<strong data-i18n="raw_json"></strong>
											<small data-i18n="raw_json_hint"></small>
										</span>
										<span class="state-badge" id="settings-state"></span>
									</summary>
									<div class="raw-settings-body">
										<textarea id="settings-json" rows="22" spellcheck="false" aria-label="settings.json"></textarea>
										<div class="raw-settings-footer">
											<code class="path" id="settings-path"></code>
											<div class="button-row">
												<button class="btn" type="button" id="btn-settings-validate" data-i18n="validate"></button>
												<button class="btn primary" type="button" id="btn-settings-save" data-i18n="save_reload"></button>
											</div>
										</div>
									</div>
								</details>
							</section>
						</div>
					</section>
				</main>
			</div>
		</div>

		<dialog class="editor-dialog" id="editor-dialog">
			<form id="editor-form">
				<header class="dialog-header">
					<div>
						<p class="eyebrow" data-i18n="edit_configuration"></p>
						<h2 id="editor-title"></h2>
						<p class="dialog-description" id="editor-description"></p>
					</div>
					<button class="icon-button" type="button" id="editor-close" aria-label="Close">×</button>
				</header>
				<div class="dialog-body" id="editor-fields"></div>
				<p class="dialog-error hidden" id="editor-error" role="alert"></p>
				<footer class="dialog-footer">
					<button class="btn" type="button" id="editor-cancel" data-i18n="cancel"></button>
					<button class="btn primary" type="submit" id="editor-submit" data-i18n="save"></button>
				</footer>
			</form>
		</dialog>

		<datalist id="api-options">
			<option value="openai-completions"></option>
			<option value="openai-responses"></option>
			<option value="anthropic-messages"></option>
			<option value="azure-openai-responses"></option>
			<option value="bedrock-converse-stream"></option>
		</datalist>

		<script>__PI_GROK_WEB_CONFIG_APP__</script>
	</body>
</html>
