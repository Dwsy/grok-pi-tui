name: Pi slim ARM64 CI (non-release)

# Batch slimming: build only on explicit dispatch, not on every intermediate commit.
# This job never publishes releases.
on:
  workflow_dispatch:
    inputs:
      runner:
        description: macOS host; the output target remains aarch64-apple-darwin
        required: true
        default: macos-15-intel
        type: choice
        options:
          - macos-15-intel
          - macos-15
          - macos-26
      scope:
        description: Full matrix or one ARM64 lane when hosted runners lack capacity
        required: true
        default: all
        type: choice
        options:
          - all
          - shell-only
          - candidate-only
          - release-only
          - checks-only

permissions:
  contents: read

concurrency:
  # Intel cross-checks must not prevent a native ARM64 candidate from starting.
  group: pi-slim-${{ github.ref }}-${{ inputs.runner }}-${{ inputs.scope }}
  cancel-in-progress: false

jobs:
  arm64:
    name: ARM64 release-dist build and native smoke
    if: inputs.scope == 'all' || inputs.scope == 'candidate-only' || inputs.scope == 'release-only'
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 150
    env:
      GROK_PI_VERSION: "0.0.0-slim-ci"
      CARGO_PROFILE_RELEASE_DIST_CODEGEN_UNITS: "16"
      CARGO_PROFILE_RELEASE_DIST_LTO: "off"
      CARGO_PROFILE_RELEASE_DIST_DEBUG: "0"
      CARGO_PROFILE_RELEASE_DIST_STRIP: "none"
      CARGO_INCREMENTAL: "0"
    steps:
      - name: Record build host architecture
        run: |
          uname -m
          echo "Rust target: aarch64-apple-darwin"

      - name: Bound native ARM64 compilation memory
        if: runner.arch == 'ARM64'
        run: echo "CARGO_BUILD_JOBS=2" >> "$GITHUB_ENV"
      - name: Check out exact commit
        uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Reject misplaced Rust cfg attributes before compilation
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          misplaced = re.compile(r"(?m)^\s*(?:async|unsafe|const)\s+#\[cfg\b")
          bad = []
          for path in Path("crates/codegen").rglob("*.rs"):
              for match in misplaced.finditer(path.read_text(errors="replace")):
                  line = path.read_text(errors="replace").count("\n", 0, match.start()) + 1
                  bad.append(f"{path}:{line}")
          if bad:
              raise SystemExit("Misplaced #[cfg] after item qualifier:\n" + "\n".join(bad))
          print("Rust cfg attribute placement scan passed")
          PY

      - name: Install Node for Herdr lifecycle contract
        uses: actions/setup-node@v5
        with:
          node-version: "24"
          package-manager-cache: false

      - name: Test Herdr working and blocked lifecycle over local socket
        run: node --test extensions/pi-grok-herdr/lifecycle.test.mjs

      - name: Install pinned Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.97.0"
          targets: aarch64-apple-darwin

      - name: Install protoc
        shell: bash
        run: |
          set -euo pipefail
          brew install protobuf
          echo "PROTOC=$(command -v protoc)" >> "$GITHUB_ENV"

      - name: Restore and save slimming-branch cache
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: pi-slim-aarch64-apple-darwin-${{ inputs.runner }}
          cache-workspace-crates: "true"
          cache-bin: "false"

      - name: Build ARM64 grok-pi (release-dist)
        shell: bash
        run: |
          set -euo pipefail
          started=$SECONDS
          cargo build --locked --timings --profile release-dist \
            -p xai-grok-pager-bin --bin grok-pi \
            --no-default-features --features release-dist,sandbox-enforce \
            --target aarch64-apple-darwin
          echo "Build elapsed: $((SECONDS - started)) seconds"
          du -sh target/aarch64-apple-darwin/release-dist || true

      - name: Smoke-test ARM64 binary
        shell: bash
        run: |
          set -euo pipefail
          bin="target/aarch64-apple-darwin/release-dist/grok-pi"
          test -x "$bin"
          file "$bin"
          lipo -archs "$bin" | grep -qw arm64
          if [[ "$(uname -m)" == "arm64" ]]; then
            "$bin" --version
            "$bin" --help > /dev/null
            "$bin" --print-capabilities > /dev/null
          else
            echo "Cross-compiled ARM64 Mach-O verified; execution smoke requires an ARM64 host"
          fi

      - name: Smoke-test native Pager with mocked Pi JSONL RPC
        if: runner.arch == 'ARM64'
        shell: bash
        run: python3 scripts/pi-native-pty-smoke.py target/aarch64-apple-darwin/release-dist/grok-pi

      # Keep this candidate separate from the tag-driven multi-platform release.
      # Only a native ARM64 runner can ship an artifact it has executed.
      - name: Package smoke-tested ARM64 Pi candidate
        if: runner.arch == 'ARM64'
        shell: bash
        run: |
          set -euo pipefail
          src=target/aarch64-apple-darwin/release-dist/grok-pi
          test -s "$src"
          file "$src" | grep -q 'Mach-O 64-bit executable arm64'
          mkdir -p dist "$RUNNER_TEMP/pi-slim-stage"
          cp "$src" "$RUNNER_TEMP/pi-slim-stage/grok-pi"
          chmod 755 "$RUNNER_TEMP/pi-slim-stage/grok-pi"
          asset="grok-pi-macos-arm64-pi-slim-${GITHUB_SHA:0:12}.tar.gz"
          tar -C "$RUNNER_TEMP/pi-slim-stage" -czf "dist/$asset" grok-pi
          tar -tzf "dist/$asset" | grep -qx grok-pi
          (cd dist && shasum -a 256 "$asset" > "$asset.sha256")
          (cd dist && shasum -a 256 -c "$asset.sha256")
          {
            echo "git_sha=$GITHUB_SHA"
            echo "target=aarch64-apple-darwin"
            echo "profile=release-dist"
            echo "runner=${{ inputs.runner }}"
            "$src" --version
          } > dist/build-info.txt

      - name: Upload ARM64 Pi candidate (not a GitHub release)
        if: runner.arch == 'ARM64'
        uses: actions/upload-artifact@v6
        with:
          name: pi-slim-macos-arm64-${{ github.sha }}
          path: dist/
          if-no-files-found: error
          retention-days: 14

      - name: Upload Cargo timings
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: pi-slim-arm64-cargo-timings
          path: target/cargo-timings/*.html
          if-no-files-found: ignore
          retention-days: 7

  feature_checks:
    name: ARM64 dependency, feature matrix, and contract regression
    if: inputs.scope == 'all' || inputs.scope == 'candidate-only' || inputs.scope == 'checks-only'
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 110
    env:
      GROK_PI_VERSION: "0.0.0-slim-ci"
      CARGO_PROFILE_RELEASE_DIST_CODEGEN_UNITS: "16"
      CARGO_PROFILE_RELEASE_DIST_LTO: "off"
      CARGO_PROFILE_RELEASE_DIST_DEBUG: "0"
      CARGO_PROFILE_RELEASE_DIST_STRIP: "none"
      CARGO_INCREMENTAL: "0"
    steps:
      - name: Bound native ARM64 compilation memory
        if: runner.arch == 'ARM64'
        run: echo "CARGO_BUILD_JOBS=2" >> "$GITHUB_ENV"

      - name: Check out exact commit
        uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Install pinned Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.97.0"
          targets: aarch64-apple-darwin

      - name: Install protoc
        shell: bash
        run: |
          set -euo pipefail
          brew install protobuf
          echo "PROTOC=$(command -v protoc)" >> "$GITHUB_ENV"

      # Separate check/test outputs from release artifacts: a second runner
      # can validate all feature modes without serializing the 18m release.
      - name: Restore and save feature-matrix cache
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: pi-slim-feature-matrix-aarch64-apple-darwin-${{ inputs.runner }}
          cache-workspace-crates: "true"
          cache-bin: "false"

      - name: Assert stock-only dependency closure is absent from Pi
        shell: bash
        run: |
          set -euo pipefail
          cargo tree --locked -p xai-grok-pager-bin \
            --no-default-features --features release-dist,sandbox-enforce \
            --target aarch64-apple-darwin -e normal,build \
            > "$RUNNER_TEMP/pi-dependencies.txt"
          if grep -E 'tikv-jemalloc-(sys|ctl)|tikv-jemallocator|cryptify v[0-9]|pdf_oxide|async-lsp v[0-9]|lsp-types v[0-9]|scraper v[0-9]|htmd v[0-9]|[[:space:]]zip v[0-9]|xai-grok-diag-server v[0-9]|xai-grok-workspace-daemon v[0-9]|xai-codebase-graph v[0-9]|tree-sitter-(rust|typescript|python|go|javascript) v[0-9]|mimalloc v[0-9]|libmimalloc-sys v[0-9]|aws-sdk-s3|aws-config|aws-smithy-http-client|gcloud-storage|xai-grok-mcp v[0-9]|rmcp v[0-9]|xai-computer-hub-mcp-adapter v[0-9]' "$RUNNER_TEMP/pi-dependencies.txt"; then
            echo "Unexpected stock-only allocator, PDF, PPTX zip, LSP, web-fetch scraper, diag/daemon, codebase graph, cloud storage, or Grok MCP runtime in grok-pi" >&2
            exit 1
          fi
          echo "Verified: no stock jemalloc, cryptify, PDF, PPTX zip, LSP, web-fetch scraper, diag/daemon, codebase graph, cloud SDK, or Grok MCP compile dependencies"

      - name: Assert stock Grok still selects native MCP, LSP, web_fetch, PPTX, diag, and codebase graph
        shell: bash
        run: |
          set -euo pipefail
          cargo tree --locked -p xai-grok-pager-bin \
            --features stock-mcp \
            --target aarch64-apple-darwin -e normal,build \
            > "$RUNNER_TEMP/stock-grok-dependencies.txt"
          grep -E 'xai-grok-mcp v[0-9]' "$RUNNER_TEMP/stock-grok-dependencies.txt"
          grep -E 'rmcp v[0-9]' "$RUNNER_TEMP/stock-grok-dependencies.txt"
          grep -E 'async-lsp v[0-9]' "$RUNNER_TEMP/stock-grok-dependencies.txt"
          grep -E 'scraper v[0-9]' "$RUNNER_TEMP/stock-grok-dependencies.txt"
          grep -E 'htmd v[0-9]' "$RUNNER_TEMP/stock-grok-dependencies.txt"
          grep -E '[[:space:]]zip v[0-9]' "$RUNNER_TEMP/stock-grok-dependencies.txt"
          grep -E 'xai-grok-diag-server v[0-9]' "$RUNNER_TEMP/stock-grok-dependencies.txt"
          grep -E 'xai-codebase-graph v[0-9]' "$RUNNER_TEMP/stock-grok-dependencies.txt"

      - name: Assert Pager cuts its direct stock Agent edge in Pi mode
        shell: bash
        run: |
          set -euo pipefail
          cargo tree --locked -p xai-grok-pager \
            --no-default-features --target aarch64-apple-darwin \
            -e normal,build --depth 1 > "$RUNNER_TEMP/pager-no-stock-direct.txt"
          if grep -E 'xai-grok-agent v[0-9]' "$RUNNER_TEMP/pager-no-stock-direct.txt"; then
            echo "Pi Pager still directly depends on stock Agent" >&2
            exit 1
          fi
          cargo tree --locked -p xai-grok-pager \
            --target aarch64-apple-darwin -e normal,build --depth 1 \
            > "$RUNNER_TEMP/pager-stock-direct.txt"
          grep -E 'xai-grok-agent v[0-9]' "$RUNNER_TEMP/pager-stock-direct.txt"
          cargo check --locked --lib -p xai-grok-pager \
            --no-default-features --target aarch64-apple-darwin
          cargo check --locked --lib -p xai-grok-pager \
            --target aarch64-apple-darwin

      - name: Check Workspace builds without stock MCP, diag, daemon, or codebase graph (and with stock defaults)
        shell: bash
        run: |
          set -euo pipefail
          cargo tree --locked -p xai-grok-workspace \
            --no-default-features --features sandbox-enforce \
            --target aarch64-apple-darwin -e normal,build \
            > "$RUNNER_TEMP/workspace-no-stock-mcp.txt"
          if grep -E 'xai-grok-mcp v[0-9]|rmcp v[0-9]|xai-computer-hub-mcp-adapter v[0-9]|xai-grok-diag-server v[0-9]|xai-grok-workspace-daemon v[0-9]|xai-codebase-graph v[0-9]' "$RUNNER_TEMP/workspace-no-stock-mcp.txt"; then
            echo "Workspace still pulls stock MCP, diag, daemon, or codebase-graph when disabled" >&2
            exit 1
          fi
          cargo check --locked -p xai-grok-workspace --lib \
            --no-default-features --features sandbox-enforce \
            --target aarch64-apple-darwin
          cargo check --locked -p xai-grok-workspace --lib --bin xai-workspace-server \
            --target aarch64-apple-darwin

      - name: Check stock-free Shell (and stock default Shell)
        shell: bash
        run: |
          set -euo pipefail
          cargo tree --locked -p xai-grok-shell \
            --no-default-features \
            --target aarch64-apple-darwin -e normal,build \
            > "$RUNNER_TEMP/shell-no-stock-mcp.txt"
          if grep -E 'xai-grok-mcp v[0-9]|rmcp v[0-9]|xai-computer-hub-mcp-adapter v[0-9]|xai-grok-diag-server v[0-9]|xai-grok-workspace-daemon v[0-9]|xai-codebase-graph v[0-9]|[[:space:]]zip v[0-9]' "$RUNNER_TEMP/shell-no-stock-mcp.txt"; then
            echo "Shell still links stock Grok MCP, diag, daemon, codebase graph, or PPTX zip with stock features disabled" >&2
            exit 1
          fi
          cargo check --locked --lib -p xai-grok-shell \
            --no-default-features --target aarch64-apple-darwin
          cargo check --locked --lib -p xai-grok-shell \
            --target aarch64-apple-darwin

      - name: Verify stock CLI inspection compiles behind Shell stock-agent
        shell: bash
        run: |
          set -euo pipefail
          # Stock CLI invokes xai_grok_shell::{inspect,cli_models}; keep both
          # compiled while the Pi-only Shell profile excludes their modules.
          cargo check --locked -p xai-grok-pager-bin --bin xai-grok-pager \
            --no-default-features --features stock-agent \
            --target aarch64-apple-darwin

      - name: Check stock LSP, web_fetch, and PPTX tools path still compiles
        shell: bash
        run: |
          set -euo pipefail
          cargo check --locked --lib -p xai-grok-tools \
            --no-default-features --features serde,stock-lsp,stock-web-fetch,stock-pptx \
            --target aarch64-apple-darwin

      - name: Test Pi Adapter RPC Goal and Remote TUI contract
        if: runner.arch == 'ARM64'
        shell: bash
        run: |
          set -euo pipefail
          cargo test --locked --lib -p pi-grok-adapter \
            --no-default-features --target aarch64-apple-darwin

      - name: Check renderer no longer imports stock tools
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import pathlib
          import tomllib

          crate = pathlib.Path("crates/codegen/xai-grok-pager-render")
          manifest = tomllib.loads((crate / "Cargo.toml").read_text())
          assert "xai-grok-tools" not in manifest["dependencies"]
          assert "xai-grok-image" in manifest["dependencies"]
          assert "xai-grok-workspace" not in manifest["dependencies"]
          assert "xai-grok-workspace-types" in manifest["dependencies"]
          for path in (crate / "src").rglob("*.rs"):
              text = path.read_text()
              assert "xai_grok_tools::" not in text, path
              assert "xai_grok_workspace::" not in text, path
          print("Renderer no longer directly imports stock Grok Tools or the workspace runtime")
          PY

      - name: Check native diff no longer imports stock tools
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import pathlib
          import tomllib

          crate = pathlib.Path("crates/codegen/xai-grok-pager-diff")
          manifest = tomllib.loads((crate / "Cargo.toml").read_text())
          assert "xai-grok-tools" not in manifest["dependencies"]
          assert "xai-tool-types" in manifest["dependencies"]
          for path in (crate / "src").rglob("*.rs"):
              assert "xai_grok_tools::" not in path.read_text(), path
          print("Native diff uses canonical xai-tool-types without stock Grok Tools")
          PY

      - name: Test native diff wire shapes
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$(uname -m)" == "arm64" ]]; then
            cargo test --locked -p xai-grok-pager-diff --lib \
              --target aarch64-apple-darwin
          else
            cargo check --locked -p xai-grok-pager-diff --tests \
              --target aarch64-apple-darwin
          fi

      - name: Test shared contracts after dependency inversion
        shell: bash
        run: |
          set -euo pipefail
          # Includes migrated MemoryBackend staleness tests, TaskKind, ToolKind,
          # Claude tool alias registry, ClientType wire values and config types.
          if [[ "$(uname -m)" == "arm64" ]]; then
            cargo test --locked --lib \
              -p xai-tool-types -p xai-grok-workspace-types \
              -p xai-grok-config-types \
              --target aarch64-apple-darwin
          else
            cargo check --locked --tests \
              -p xai-tool-types -p xai-grok-workspace-types \
              -p xai-grok-config-types \
              --target aarch64-apple-darwin
          fi

      - name: Test renderer image-size presentation
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$(uname -m)" == "arm64" ]]; then
            cargo test --locked --profile release-dist \
              -p xai-grok-pager-render --lib \
              --target aarch64-apple-darwin \
              util::tests::format_bytes_matches_stock_grok_binary_units \
              -- --exact
          else
            cargo check --locked --tests \
              -p xai-grok-pager-render --target aarch64-apple-darwin
          fi

  shell_tests:
    name: Native Shell full regression (independent of candidate)
    if: inputs.runner != 'macos-15-intel' && inputs.scope != 'candidate-only'
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 80
    env:
      CARGO_BUILD_JOBS: '2'
      CARGO_INCREMENTAL: '0'
      CARGO_PROFILE_TEST_DEBUG: '0'
      # libtest threads default to ~2 MiB but production SessionActor threads
      # use 8 MiB (acp_session_impl/spawn.rs). An actual turn future needs the
      # production-sized stack; this does not skip or loosen any assertions.
      RUST_MIN_STACK: '8388608'
    steps:
      - name: Check out exact commit
        uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Install pinned Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: '1.97.0'
          targets: aarch64-apple-darwin

      - name: Install protoc
        shell: bash
        run: |
          set -euo pipefail
          brew install protobuf
          echo "PROTOC=$(command -v protoc)" >> "$GITHUB_ENV"

      - name: Restore Shell test cache
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: pi-slim-shell-aarch64-apple-darwin-${{ inputs.runner }}
          cache-workspace-crates: 'true'
          cache-bin: 'false'

      - name: Compile Shell test fixture (no local builds)
        shell: bash
        run: |
          set -euo pipefail
          cargo test --locked --lib -p xai-grok-shell \
            --no-default-features --features test-support \
            --target aarch64-apple-darwin -j 2 --no-run

      - name: Verify slash-authority turn regression on production-sized stack
        shell: bash
        run: |
          set -euo pipefail
          cargo test --locked --lib -p xai-grok-shell \
            --no-default-features --features test-support \
            --target aarch64-apple-darwin -j 2 \
            session::acp_session::slash_authority_turn_tests \
            -- --test-threads=1

      - name: Verify unified-list and workflow regressions
        shell: bash
        run: |
          set -euo pipefail
          for filter in \
            session::unified_list::tests::parse_list_req_preserves_kind_when_process_chat_mode_is_disabled \
            session::workflow::manager::tests::launch_effort_applies_to_children_and_child_override_wins \
            session::workflow::manager::tests::resume_reuses_immutable_launch_effort \
            session::workflow::registry::tests::save_through_symlinked_session_root_stays_in_canonical_project
          do
            cargo test --locked --lib -p xai-grok-shell \
              --no-default-features --features test-support \
              --target aarch64-apple-darwin -j 2 "$filter" \
              -- --exact --test-threads=1
          done

      - name: Verify workflow cancellation in isolation (90-second watchdog)
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os
          import signal
          import subprocess
          import sys

          test = 'session::workflow::manager::tests::cancellation_uses_run_owned_cancel_event_without_parent_detach'
          command = [
              'cargo', 'test', '--locked', '--lib', '-p', 'xai-grok-shell',
              '--no-default-features', '--features', 'test-support',
              '--target', 'aarch64-apple-darwin', '-j', '2',
              test, '--', '--exact', '--test-threads=1',
          ]
          process = subprocess.Popen(command, start_new_session=True)
          try:
              code = process.wait(timeout=90)
          except subprocess.TimeoutExpired:
              os.killpg(process.pid, signal.SIGKILL)
              process.wait()
              print(f'Workflow cancellation test exceeded 90s: {test}', file=sys.stderr)
              sys.exit(124)
          sys.exit(code)
          PY

      - name: Run full Shell suite with a 30-minute watchdog
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os
          import signal
          import subprocess
          import sys

          command = [
              'cargo', 'test', '--locked', '--lib', '-p', 'xai-grok-shell',
              '--no-default-features', '--features', 'test-support',
              '--target', 'aarch64-apple-darwin', '-j', '2',
              # The cancellation regression above executes independently in
              # an isolated test process with a hard timeout, not suppressed.
              '--', '--test-threads=1', '--skip',
              'session::workflow::manager::tests::cancellation_uses_run_owned_cancel_event_without_parent_detach',
          ]
          process = subprocess.Popen(command, start_new_session=True)
          try:
              code = process.wait(timeout=1800)
          except subprocess.TimeoutExpired:
              os.killpg(process.pid, signal.SIGKILL)
              process.wait()
              print('Shell suite exceeded 30 minutes; inspect running tests for deadlocks', file=sys.stderr)
              sys.exit(124)
          sys.exit(code)
          PY
