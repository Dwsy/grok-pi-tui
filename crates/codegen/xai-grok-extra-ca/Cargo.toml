[package]
license = "Apache-2.0"
name = "xai-grok-extra-ca"
version = "0.1.0"
edition.workspace = true
description = "TLS policy for the grok CLI: rustls backend pin, process crypto provider, shared root store, and opt-in GROK_EXTRA_CA_BUNDLE roots"

[dependencies]
base64 = { workspace = true }
# Not reqwest 0.13: blocking TLS overflows on Windows arm64 (#237643).
# native-roots + webpki-roots must ship with this crate or a broken OS store fails client build.
reqwest = { workspace = true, features = ["blocking", "rustls-tls-native-roots", "rustls-tls-webpki-roots"] }
# ensure_default_crypto_provider needs aws-lc-rs; unification would mask its absence.
rustls = { version = "0.23", default-features = false, features = ["aws-lc-rs", "std"] }
rustls-native-certs = { workspace = true }
tracing = { workspace = true }
webpki-roots = { workspace = true }

[dev-dependencies]
rcgen = { workspace = true }
# ring, so the preinstalled-provider test can install a non-aws-lc-rs default.
rustls = { workspace = true, features = ["ring"] }
tempfile = { workspace = true }

[lints]
workspace = true
