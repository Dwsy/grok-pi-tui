name: Pi slim ARM64 CI (non-release)

# Batch slimming: build only on explicit dispatch, not on every intermediate commit.
# This job never publishes releases.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pi-slim-${{ github.ref }}
  cancel-in-progress: false

jobs:
  arm64:
    name: ARM64 dependency and release-build validation
    runs-on: macos-15
    timeout-minutes: 150
    env:
      GROK_PI_VERSION: "0.0.0-slim-ci"
      CARGO_PROFILE_RELEASE_DIST_CODEGEN_UNITS: "16"
      CARGO_PROFILE_RELEASE_DIST_LTO: "off"
      CARGO_PROFILE_RELEASE_DIST_DEBUG: "0"
      CARGO_PROFILE_RELEASE_DIST_STRIP: "none"
      CARGO_INCREMENTAL: "0"
    steps:
      - name: Check out exact commit
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Install pinned Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.97.0"
          targets: aarch64-apple-darwin

      - name: Install protoc
        shell: bash
        run: |
          set -euo pipefail
          brew install protobuf
          echo "PROTOC=$(command -v protoc)" >> "$GITHUB_ENV"

      - name: Restore and save slimming-branch cache
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: pi-slim-aarch64-apple-darwin
          cache-workspace-crates: "true"
          cache-bin: "false"

      - name: Assert stock-only dependency closure is absent from Pi
        shell: bash
        run: |
          set -euo pipefail
          cargo tree --locked -p xai-grok-pager-bin \
            --no-default-features --features release-dist,sandbox-enforce \
            --target aarch64-apple-darwin -e normal,build \
            > "$RUNNER_TEMP/pi-dependencies.txt"
          if grep -E 'tikv-jemalloc-(sys|ctl)|tikv-jemallocator|cryptify v[0-9]|pdf_oxide|aws-sdk-s3|aws-config|aws-smithy-http-client|gcloud-storage|xai-grok-mcp v[0-9]|rmcp v[0-9]|xai-computer-hub-mcp-adapter v[0-9]' "$RUNNER_TEMP/pi-dependencies.txt"; then
            echo "Unexpected stock-only allocator, PDF, cloud storage, or Grok MCP runtime in grok-pi" >&2
            exit 1
          fi
          echo "Verified: no stock jemalloc, cryptify, PDF, cloud SDK, or Grok MCP compile dependencies"

      - name: Assert stock Grok still selects native MCP
        shell: bash
        run: |
          set -euo pipefail
          cargo tree --locked -p xai-grok-pager-bin \
            --features stock-mcp \
            --target aarch64-apple-darwin -e normal,build \
            > "$RUNNER_TEMP/stock-grok-dependencies.txt"
          grep -E 'xai-grok-mcp v[0-9]' "$RUNNER_TEMP/stock-grok-dependencies.txt"
          grep -E 'rmcp v[0-9]' "$RUNNER_TEMP/stock-grok-dependencies.txt"

      - name: Check Workspace builds without stock MCP
        shell: bash
        run: |
          set -euo pipefail
          cargo tree --locked -p xai-grok-workspace \
            --no-default-features --features sandbox-enforce \
            --target aarch64-apple-darwin -e normal,build \
            > "$RUNNER_TEMP/workspace-no-stock-mcp.txt"
          if grep -E 'xai-grok-mcp v[0-9]|rmcp v[0-9]|xai-computer-hub-mcp-adapter v[0-9]' "$RUNNER_TEMP/workspace-no-stock-mcp.txt"; then
            echo "Workspace still pulls the Grok MCP runtime when stock-mcp is off" >&2
            exit 1
          fi
          cargo check --locked -p xai-grok-workspace --lib \
            --no-default-features --features sandbox-enforce \
            --target aarch64-apple-darwin

      - name: Check stock-MCP-free Shell and test fixtures
        shell: bash
        run: |
          set -euo pipefail
          cargo tree --locked -p xai-grok-shell \
            --no-default-features \
            --target aarch64-apple-darwin -e normal,build \
            > "$RUNNER_TEMP/shell-no-stock-mcp.txt"
          if grep -E 'xai-grok-mcp v[0-9]|rmcp v[0-9]|xai-computer-hub-mcp-adapter v[0-9]' "$RUNNER_TEMP/shell-no-stock-mcp.txt"; then
            echo "Shell still links stock Grok MCP with stock-mcp disabled" >&2
            exit 1
          fi
          cargo check --locked --lib -p xai-grok-shell \
            --no-default-features --target aarch64-apple-darwin
          cargo test --locked --lib -p xai-grok-shell \
            --no-default-features --target aarch64-apple-darwin

      - name: Build ARM64 grok-pi (release-dist)
        shell: bash
        run: |
          set -euo pipefail
          started=$SECONDS
          cargo build --locked --timings --profile release-dist \
            -p xai-grok-pager-bin --bin grok-pi \
            --no-default-features --features release-dist,sandbox-enforce \
            --target aarch64-apple-darwin
          echo "Build elapsed: $((SECONDS - started)) seconds"
          du -sh target/aarch64-apple-darwin/release-dist || true

      - name: Smoke-test ARM64 binary
        shell: bash
        run: |
          set -euo pipefail
          bin="target/aarch64-apple-darwin/release-dist/grok-pi"
          test -x "$bin"
          file "$bin"
          "$bin" --version
          "$bin" --help > /dev/null
          "$bin" --print-capabilities > /dev/null

      - name: Check renderer no longer imports stock tools
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import pathlib
          import tomllib

          crate = pathlib.Path("crates/codegen/xai-grok-pager-render")
          manifest = tomllib.loads((crate / "Cargo.toml").read_text())
          assert "xai-grok-tools" not in manifest["dependencies"]
          assert "xai-grok-image" in manifest["dependencies"]
          for path in (crate / "src").rglob("*.rs"):
              assert "xai_grok_tools::" not in path.read_text(), path
          print("Renderer no longer directly imports stock Grok Tools")
          PY

      - name: Check native diff no longer imports stock tools
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import pathlib
          import tomllib

          crate = pathlib.Path("crates/codegen/xai-grok-pager-diff")
          manifest = tomllib.loads((crate / "Cargo.toml").read_text())
          assert "xai-grok-tools" not in manifest["dependencies"]
          assert "xai-tool-types" in manifest["dependencies"]
          for path in (crate / "src").rglob("*.rs"):
              assert "xai_grok_tools::" not in path.read_text(), path
          print("Native diff uses canonical xai-tool-types without stock Grok Tools")
          PY

      - name: Test native diff wire shapes
        shell: bash
        run: |
          set -euo pipefail
          cargo test --locked -p xai-grok-pager-diff --lib \
            --target aarch64-apple-darwin

      - name: Test shared contracts after dependency inversion
        shell: bash
        run: |
          set -euo pipefail
          # Includes migrated MemoryBackend staleness tests, TaskKind, ToolKind,
          # Claude tool alias registry, ClientType wire values and config types.
          cargo test --locked --lib \
            -p xai-tool-types -p xai-grok-workspace-types \
            -p xai-grok-config-types \
            --target aarch64-apple-darwin

      - name: Test renderer image-size presentation
        shell: bash
        run: |
          set -euo pipefail
          cargo test --locked --profile release-dist \
            -p xai-grok-pager-render --lib \
            --target aarch64-apple-darwin \
            util::tests::format_bytes_matches_stock_grok_binary_units \
            -- --exact

      - name: Upload Cargo timings
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pi-slim-arm64-cargo-timings
          path: target/cargo-timings/*.html
          if-no-files-found: ignore
          retention-days: 7
