# Language Icons and Colors Configuration
# Based on nvim-web-devicons standard colors and Nerd Font glyphs
# This file is loaded at runtime to provide colored file icons in the review file tree.

# Format:
# [[language]]
# extensions = ["rs", "toml"]        # File extensions (without dot)
# filenames = ["Cargo.toml", "Cargo.lock"]  # Exact filenames (case-insensitive)
# icon = "\u{e68b}"                    # Nerd Font glyph (Unicode escape)
# color_dark = "#dea584"               # Color for dark themes (hex RGB)
# color_light = "#b86c3a"              # Color for light themes (hex RGB, typically darker/more saturated)
#
# If only `color` is provided, it's used for both themes.

# ─── Core Languages ────────────────────────────────────────────────

[[language]]
extensions = ["rs"]
filenames = ["Cargo.toml", "Cargo.lock", "rust-toolchain.toml", "rustfmt.toml", "clippy.toml"]
icon = "\u{e68b}"
color_dark = "#dea584"
