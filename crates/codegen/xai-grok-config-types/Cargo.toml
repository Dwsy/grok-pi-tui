[package]
license = "Apache-2.0"
name = "xai-grok-config-types"
version = "0.1.0"
edition.workspace = true
description = "Leaf configuration value types for the grok CLI, extracted from xai-grok-shell for dependency inversion."

[dependencies]
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
strum = { workspace = true }
toml = { workspace = true }
tracing = { workspace = true }
xai-grok-config = { workspace = true }
xai-grok-sandbox = { path = "../xai-grok-sandbox", default-features = false }

[features]
default-bazel = []

[lints]
workspace = true
