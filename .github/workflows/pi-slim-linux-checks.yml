name: Pi slim Linux source checks (non-release)

# A cross-platform source/contract check when GitHub-hosted macOS ARM64
# machines cannot be acquired. This workflow NEVER builds or publishes the
# macOS release candidate; macOS ARM64 is still the product acceptance gate.
on:
  # Bootstrap a new workflow on the isolated branch without touching the
  # default branch. Subsequent runs remain explicit/manual.
  push:
    branches:
      - refactor/pi-slim-20261116
    paths:
      - .github/workflows/pi-slim-linux-checks.yml
  workflow_dispatch:
    inputs:
      scope:
        description: Select fast typechecks or include Workflow/adapter tests
        required: true
        default: all
        type: choice
        options:
          - all
          - typecheck-only

permissions:
  contents: read

concurrency:
  group: pi-slim-linux-${{ github.ref }}-${{ inputs.scope }}
  cancel-in-progress: false

jobs:
  source-checks:
    name: Linux source parity (not ARM64 release validation)
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      CARGO_BUILD_JOBS: "2"
      CARGO_INCREMENTAL: "0"
      CARGO_PROFILE_TEST_DEBUG: "0"
      RUST_MIN_STACK: "8388608"
      GROK_PI_VERSION: "0.0.0-slim-ci"
    steps:
      - name: Check out exact branch commit
        uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Install pinned Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.97.0"

      - name: Install protoc
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install --yes protobuf-compiler
          echo "PROTOC=$(command -v protoc)" >> "$GITHUB_ENV"

      - name: Restore source-check cache
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: pi-slim-linux-source-parity
          cache-workspace-crates: "true"
          cache-bin: "false"

      - name: Check Pi and Stock Shell/Agent compile boundaries
        shell: bash
        run: |
          set -euo pipefail
          cargo check --locked --lib -p xai-grok-shell --no-default-features
          cargo check --locked --lib -p xai-grok-shell \
            --no-default-features --features stock-agent
          cargo check --locked --lib -p xai-grok-pager --no-default-features
          cargo check --locked -p xai-grok-pager-bin --bin grok-pi \
            --no-default-features --features release-dist,sandbox-enforce
          cargo check --locked -p xai-grok-pager-bin --bin xai-grok-pager \
            --no-default-features --features stock-agent

      - name: TEMP map stock agent and login dependents in the Pi closure
        shell: bash
        run: |
          set -uo pipefail
          for pkg in xai-grok-agent xai-grok-login; do
            echo "===== dependents of $pkg ====="
            cargo tree --locked -p xai-grok-pager-bin --no-default-features \
              --features release-dist,sandbox-enforce -e normal,build -i "$pkg" 2>&1 | head -40 || true
          done

      - name: Assert the sampler runtime stays outside the Pi compile closure
        shell: bash
        run: |
          set -euo pipefail
          # Pi ships without the Stock sampling runtime; finding it here is a regression
          # of the optional `stock-agent` gate, not a harmless extra dependency.
          if cargo tree --locked -p xai-grok-pager-bin --no-default-features \
               --features release-dist,sandbox-enforce -e normal -i xai-grok-sampler >/dev/null 2>&1; then
            echo "::error::xai-grok-sampler is back in the Pi compile closure"
            exit 1
          fi
          # The Stock shell must still carry it, otherwise the gate disabled Stock sampling.
          cargo tree --locked -p xai-grok-shell --no-default-features --features stock-agent \
            -e normal -i xai-grok-sampler >/dev/null

      - name: Verify Workflow cancellation without a hanging suite
        if: github.event_name == 'push' || inputs.scope == 'all'
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os
          import signal
          import subprocess
          import sys

          test = 'session::workflow::manager::tests::cancellation_uses_run_owned_cancel_event_without_parent_detach'
          command = [
              'cargo', 'test', '--locked', '--lib', '-p', 'xai-grok-shell',
              '--no-default-features', '--features', 'test-support',
              '-j', '2', test, '--', '--exact', '--test-threads=1',
          ]
          process = subprocess.Popen(command, start_new_session=True)
          try:
              code = process.wait(timeout=1200)
          except subprocess.TimeoutExpired:
              os.killpg(process.pid, signal.SIGKILL)
              process.wait()
              print('Workflow cancellation build/test exceeded 20 minutes', file=sys.stderr)
              sys.exit(124)
          sys.exit(code)
          PY

      - name: Test Stock agent boot and leader lifecycle
        if: github.event_name == 'push' || inputs.scope == 'all'
        shell: bash
        run: |
          set -euo pipefail
          # The ordinary Pi Shell test configuration correctly excludes
          # Stock's app/server modules. Exercise their tests explicitly.
          cargo test --locked --lib -p xai-grok-shell \
            --no-default-features --features stock-agent,test-support \
            -j 2 agent::app::tests -- --test-threads=1

      - name: Test Pi JSONL RPC / Goal / Remote TUI contracts
        if: github.event_name == 'push' || inputs.scope == 'all'
        shell: bash
        run: |
          set -euo pipefail
          cargo test --locked --lib -p pi-grok-adapter --no-default-features -j 2
