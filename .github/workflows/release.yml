name: Release grok-pi

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing release tag (vX.Y.Z or vX.Y.Z-beta.N)"
        required: true
        type: string
      targets:
        description: "Platforms to build (comma-separated keys; empty = all six). Keys: macos-arm64, macos-x86_64, linux-x86_64, linux-aarch64, windows-x86_64, windows-aarch64. Example for a local macOS ARM64 beta: macos-arm64"
        required: false
        default: ""
        type: string

env:
  # One canonical tag drives version stamping, changelog extraction and publishing.
  # Tag pushes use github.ref_name; manual runs must provide the release tag.
  GROK_PI_RELEASE_TAG: ${{ inputs.tag || github.ref_name }}

permissions:
  contents: write

jobs:
  # `workflow_dispatch` may restrict the matrix to a single platform (e.g. a
  # local macOS ARM64 beta). Tag pushes never set `targets`, so they still ship
  # all six assets. The single source of truth is scripts/release-targets.json.
  prepare-matrix:
    name: Resolve build matrix
    runs-on: ubuntu-24.04
    outputs:
      matrix: ${{ steps.resolve.outputs.matrix }}
      assets: ${{ steps.resolve.outputs.assets }}
    steps:
      - name: Check out source
        uses: actions/checkout@v7
        with:
          ref: ${{ env.GROK_PI_RELEASE_TAG }}

      - name: Resolve requested targets
        id: resolve
        shell: bash
        env:
          REQUESTED: ${{ inputs.targets }}
        run: |
          set -euo pipefail
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json, os, sys

          with open("scripts/release-targets.json", encoding="utf-8") as fh:
              all_targets = json.load(fh)

          requested_raw = os.environ.get("REQUESTED", "").strip()
          if not requested_raw:
              selected = all_targets
          else:
              wanted = [k.strip() for k in requested_raw.split(",") if k.strip()]
              known = {t["key"] for t in all_targets}
              unknown = [k for k in wanted if k not in known]
              if unknown:
                  print(
                      "Unknown target key(s): " + ", ".join(unknown) +
                      ". Known: " + ", ".join(sorted(known)),
                      file=sys.stderr,
                  )
                  sys.exit(1)
              by_key = {t["key"]: t for t in all_targets}
              selected = [by_key[k] for k in wanted]

          print("matrix=" + json.dumps({"include": selected}, separators=(",", ":")))
          # The release notes must advertise exactly what this run publishes:
          # a single-platform beta ships one archive, not six.
          print("assets=" + ",".join(t["asset"] for t in selected))
          print("Selected " + str(len(selected)) + " target(s): " +
                ", ".join(t["key"] for t in selected), file=sys.stderr)
          PY

  validate-changelog:
    name: Validate changelog
    runs-on: ubuntu-24.04
    steps:
      - name: Check out source
        uses: actions/checkout@v7
        with:
          # Manual dispatch must inspect the existing release tag, not main.
          ref: ${{ env.GROK_PI_RELEASE_TAG }}

      - name: Require changelog section for release tags
        shell: bash
        run: |
          set -euo pipefail
          ref="${GROK_PI_RELEASE_TAG}"
          if [[ ! "$ref" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-beta\.[0-9]+)?$ ]]; then
            echo "Unsupported release tag: $ref" >&2
            echo "Expected vX.Y.Z or vX.Y.Z-beta.N." >&2
            exit 1
          fi

          ver="${ref#v}"
          python3 scripts/extract-changelog-section.py --self-test
          python3 scripts/extract-changelog-section.py \
            "$ver" CHANGELOG.MD \
            --strict \
            -o "$RUNNER_TEMP/release-notes.md"
          echo "Validated CHANGELOG.MD section [$ver] for $ref"

  build:
    name: ${{ matrix.name }}
    needs: [validate-changelog, prepare-matrix]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: ${{ matrix.timeout }}
    strategy:
      fail-fast: false
      # Resolved from scripts/release-targets.json by `prepare-matrix`. Tag
      # pushes get all six; a manual beta run can pass `targets: macos-arm64`
      # to build only the one platform being tested locally.
      matrix: ${{ fromJSON(needs.prepare-matrix.outputs.matrix) }}

    steps:
      - name: Check out source
        uses: actions/checkout@v7
        with:
          ref: ${{ env.GROK_PI_RELEASE_TAG }}

      - name: Read repository Rust version
        id: rust
        shell: bash
        run: |
          set -euo pipefail
          channel=$(sed -n 's/^channel = "\([^"]*\)".*/\1/p' rust-toolchain.toml)
          test -n "$channel"
          echo "channel=$channel" >> "$GITHUB_OUTPUT"

      - name: Install repository Rust toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ steps.rust.outputs.channel }}
          targets: ${{ matrix.target }}

      - name: Verify active Rust target
        shell: bash
        run: |
          set -euo pipefail
          rustc --version
          rustup target list --installed | grep -Fx -- '${{ matrix.target }}'

      # Releases run on distinct v* tag refs. Actions target caches written by
      # one tag are not readable by the next tag, yet macOS/Windows previously
      # uploaded ~1.4-2.1 GB per matrix job. Avoid paying to upload caches
      # that the next beta/stable tag cannot reuse. Revisit using a shared
      # default-branch build context or an external sccache backend.

      - name: Install protoc on Linux
        if: runner.os == 'Linux'
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install --yes protobuf-compiler
          echo "PROTOC=$(command -v protoc)" >> "$GITHUB_ENV"

      - name: Install Linux aarch64 cross toolchain
        if: runner.os == 'Linux' && matrix.cross
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install --yes gcc-aarch64-linux-gnu g++-aarch64-linux-gnu
          # Tell cargo/cc which linker to use for the aarch64 target.
          echo "CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER=aarch64-linux-gnu-gcc" >> "$GITHUB_ENV"
          echo "CC_aarch64_unknown_linux_gnu=aarch64-linux-gnu-gcc" >> "$GITHUB_ENV"
          echo "CXX_aarch64_unknown_linux_gnu=aarch64-linux-gnu-g++" >> "$GITHUB_ENV"

      - name: Install protoc on macOS
        if: runner.os == 'macOS'
        shell: bash
        run: |
          brew install protobuf
          echo "PROTOC=$(command -v protoc)" >> "$GITHUB_ENV"

      - name: Install protoc on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          choco install protoc --yes --no-progress
          $protoc = (Get-Command protoc).Source
          "PROTOC=$protoc" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Resolve release version
        id: version
        shell: bash
        run: |
          ref="${GROK_PI_RELEASE_TAG}"
          ver="${ref#v}"
          echo "version=${ver}" >> "$GITHUB_OUTPUT"
          echo "Resolved GROK_PI_VERSION=${ver}"

      - name: Build release binary
        shell: bash
        env:
          # Keep the grok-pi product version independent from Grok's
          # release-only GROK_VERSION stamp.
          GROK_PI_VERSION: ${{ steps.version.outputs.version }}
          # Optimize build throughput across all six targets. The old
          # CGU=1/Thin LTO/DWARF profile cost 26-59 minutes per cold build
          # in beta.2; macOS has already used these faster settings.
          # Keep production hardening (panic=abort, linker flags, sandbox).
          CARGO_PROFILE_RELEASE_DIST_CODEGEN_UNITS: "16"
          CARGO_PROFILE_RELEASE_DIST_LTO: "off"
          CARGO_PROFILE_RELEASE_DIST_DEBUG: "0"
          # Strip Linux distribution symbols (Linux archives were >100 MB).
          # Other targets keep their existing symbol-stripping behavior.
          CARGO_PROFILE_RELEASE_DIST_STRIP: ${{ runner.os == 'Linux' && 'symbols' || 'none' }}
          CARGO_INCREMENTAL: "0"
        run: |
          set -uo pipefail
          echo "Release tag: ${GROK_PI_RELEASE_TAG}; pinned source commit: $(git rev-parse HEAD)"
          echo "Release target: ${{ matrix.target }}"
          echo "Cargo profile: codegen-units=${CARGO_PROFILE_RELEASE_DIST_CODEGEN_UNITS}, lto=${CARGO_PROFILE_RELEASE_DIST_LTO}, debug=${CARGO_PROFILE_RELEASE_DIST_DEBUG}, strip=${CARGO_PROFILE_RELEASE_DIST_STRIP}"
          echo "Disk space before build:"
          df -h . || true
          started=$SECONDS
          cargo build \
            --locked \
            --timings \
            --profile release-dist \
            -p xai-grok-pager-bin \
            --bin grok-pi \
            --features release-dist \
            --target "${{ matrix.target }}"
          build_status=$?
          duration=$((SECONDS - started))
          echo "Cargo exit status: ${build_status}; build duration: ${duration}s"
          echo "Disk space after build:"
          df -h . || true
          du -sh target 2>/dev/null || true
          du -sh "target/${{ matrix.target }}/release-dist" 2>/dev/null || true
          {
            echo "### ${{ matrix.name }} — release build"
            echo ""
            echo "- Cargo exit status: ${build_status}"
            echo "- Build duration: ${duration}s"
            echo "- CGU: ${CARGO_PROFILE_RELEASE_DIST_CODEGEN_UNITS}, LTO: ${CARGO_PROFILE_RELEASE_DIST_LTO}, debug: ${CARGO_PROFILE_RELEASE_DIST_DEBUG}, strip: ${CARGO_PROFILE_RELEASE_DIST_STRIP}"
            echo ""
            echo 'Run the cargo-timings artifact for the per-crate compile critical path.'
          } >> "${GITHUB_STEP_SUMMARY}"
          exit "${build_status}"

      - name: Upload compiler timing report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: build-timings-${{ matrix.target }}
          path: target/cargo-timings/*.html
          if-no-files-found: ignore
          retention-days: 7

      - name: Package Unix binary
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          src="target/${{ matrix.target }}/release-dist/${{ matrix.bin }}"
          test -f "$src"
          # Stage a clean name so tarball root contains just `grok-pi`.
          stage="$(mktemp -d)"
          cp "$src" "$stage/grok-pi"
          chmod 755 "$stage/grok-pi"
          tar -C "$stage" -czf "dist/${{ matrix.asset }}" grok-pi
          ls -lh "dist/${{ matrix.asset }}"

      - name: Package Windows binary
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          $src = "target/${{ matrix.target }}/release-dist/${{ matrix.bin }}"
          if (-not (Test-Path -LiteralPath $src)) {
            throw "missing binary: $src"
          }
          # Stage as grok-pi.exe at archive root.
          $stage = Join-Path $env:RUNNER_TEMP "grok-pi-stage"
          New-Item -ItemType Directory -Force -Path $stage | Out-Null
          Copy-Item -LiteralPath $src -Destination (Join-Path $stage "grok-pi.exe") -Force
          Compress-Archive -Path (Join-Path $stage "grok-pi.exe") -DestinationPath "dist/${{ matrix.asset }}" -Force
          Get-Item "dist/${{ matrix.asset }}" | Format-List Name, Length

      - name: Upload release asset
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.asset }}
          path: dist/${{ matrix.asset }}
          if-no-files-found: error

  release:
    name: Publish GitHub release
    needs: [build, prepare-matrix]
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04

    steps:
      - name: Check out release scripts
        uses: actions/checkout@v7
        with:
          ref: ${{ env.GROK_PI_RELEASE_TAG }}

      - name: Download release binaries
        uses: actions/download-artifact@v8
        with:
          path: release-assets
          # Keep build-timings-* diagnostics out of the user-facing release.
          pattern: grok-pi-*
          merge-multiple: true

      - name: Add installer scripts
        shell: bash
        run: |
          cp install.sh install.ps1 release-assets/
          chmod +x release-assets/install.sh
          ls -la release-assets/

      - name: Extract CHANGELOG for this tag
        id: notes
        shell: bash
        env:
          # Comma-separated asset filenames resolved by `prepare-matrix`, i.e.
          # exactly the archives this run builds. Empty on legacy reruns that
          # only pass a tag, in which case the extractor keeps its full list.
          RELEASE_ASSETS: ${{ needs.prepare-matrix.outputs.assets }}
        run: |
          set -euo pipefail
          ref="${GROK_PI_RELEASE_TAG}"
          ver="${ref#v}"
          mkdir -p dist

          # Sanity-check the extractor before cutting notes.
          python3 scripts/extract-changelog-section.py --self-test

          # Use one matching section for normal releases. Preserve cumulative
          # notes only for the legacy 0.0.x line; newer releases must not emit
          # the entire historical changelog by default. Override explicitly
          # with RELEASE_NOTES_SINCE when a cumulative release is intentional.
          extract_args=(
            "${ver}"
            CHANGELOG.MD
            -o dist/release-notes.md
            --repo "${GITHUB_REPOSITORY}"
            --strict
            --with-install
          )
          if [[ -z "${RELEASE_NOTES_SINCE+x}" && "$ver" == 0.0.* ]]; then
            extract_args+=(--since 0.0.6)
          elif [[ -n "${RELEASE_NOTES_SINCE:-}" ]]; then
            extract_args+=(--since "${RELEASE_NOTES_SINCE}")
          fi

          # Advertise only the assets this run actually publishes; a
          # single-platform beta must not list five archives it never built.
          if [[ -n "${RELEASE_ASSETS:-}" ]]; then
            IFS=',' read -ra assets <<< "${RELEASE_ASSETS}"
            for asset in "${assets[@]}"; do
              [[ -n "$asset" ]] && extract_args+=(--asset "$asset")
            done
          fi

          python3 scripts/extract-changelog-section.py "${extract_args[@]}"

          echo "version=${ver}" >> "$GITHUB_OUTPUT"
          echo "notes_path=dist/release-notes.md" >> "$GITHUB_OUTPUT"
          echo "bytes=$(wc -c < dist/release-notes.md | tr -d ' ')" >> "$GITHUB_OUTPUT"
          echo "--- release notes preview (first 60 lines) ---"
          head -n 60 dist/release-notes.md

      - name: Upload release notes artifact
        uses: actions/upload-artifact@v7
        with:
          name: release-notes
          path: dist/release-notes.md
          if-no-files-found: error

      - name: Create GitHub release
        uses: softprops/action-gh-release@v3
        with:
          # CHANGELOG.MD tag section only; do not append GitHub's full commit
          # history to every release body.
          body_path: dist/release-notes.md
          generate_release_notes: false
          # Manual dispatch and tag pushes share the exact same release tag.
          tag_name: ${{ env.GROK_PI_RELEASE_TAG }}
          # The requested tag must already exist (checkout above enforces this).
          # Do not pass target_commitish: GitHub requires workflow-write permission
          # when that older commit differs from the default branch workflow files,
          # and Actions' GITHUB_TOKEN cannot be granted that permission.
          # A beta tag ships the same six platform assets, but is not promoted
          # by GitHub's stable `releases/latest` pointer. Unsupported prerelease
          # suffixes are rejected before the build starts.
          prerelease: ${{ contains(env.GROK_PI_RELEASE_TAG, '-beta.') }}
          files: release-assets/*
